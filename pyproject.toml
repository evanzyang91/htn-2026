[project]
name = "skillweaver"
version = "0.1.0"
description = "Self-growing skill library for computer-use agents: learn a task once, save it as code, compose it into faster runs."
readme = "README.md"
# Pinned to 3.12: every dependency below ships macOS arm64 wheels for it, and
# rapidocr-onnxruntime does not support 3.13 yet.
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python>=4.9,<5",
    "playwright>=1.45",
    "ultralytics>=8.3",
    "rapidocr-onnxruntime>=1.3.24",
    "mss>=9.0",
    "pyautogui>=0.9.54",
    "anthropic>=1.0",
    "google-genai>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillweaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes `from tests.fakes import ...` importable from any test file.
pythonpath = ["."]
# importlib mode lets parallel workers add same-named test files in different
# directories without needing tests/**/__init__.py.
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["skillweaver", "tests"]
