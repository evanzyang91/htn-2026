# The evaluation suite: 14 tasks against apps/sandbox-site (Northwind Console).
#
# Loaded by skillweaver.eval.harness.load_suite. Run it with:
#
#     python3 apps/sandbox-site/serve.py --port 8765 &
#     uv run python -m skillweaver.cli eval run --suite eval/tasks.yaml --repeat 3
#
# ----------------------------------------------------------------------------------
# How a task is scored
# ----------------------------------------------------------------------------------
#
# `expect` is a list of checks against the sandbox's own GET /__state - the server's
# authoritative description of what is on screen. That state IS the ground truth and
# it is an OFFLINE TEACHER: the harness reads it to score a finished run and the agent
# never sees it, never receives it, and has no handle on the object that fetches it.
# See the Referee protocol in harness.py, which is the only door to it.
#
# Each check is `path` plus exactly one operator:
#
#   equals:   <value>   the value at `path` equals this exactly
#   contains: <value>   substring of a string, or membership of a list
#   count:    <int>     the list or string at `path` has this length
#   at_least: <int>     the list or string at `path` is at least this long
#   absent:   true      nothing exists at `path` (or it is null)
#
# `path` is dotted, with two kinds of index:
#
#   mail.messages[id=m03].archived      first list element whose `id` field is "m03"
#   mail.sent[0].subject                element by position
#
# ----------------------------------------------------------------------------------
# params, and the three shapes
# ----------------------------------------------------------------------------------
#
# `params` are the values a caller could supply instead of leaving the agent to read
# them out of the sentence. They are NOT given to the plain-English runs. Each task
# that declares them is run one extra time WITH them supplied, and the two are
# reported separately, because "the warm path makes no model calls" is only true once
# the parameters are known: asked in English, the warm path still spends one small
# call working out that "Dana Whitfield's message" means sender="Dana Whitfield".
# Quoting the zero without that condition would be the most flattering number in the
# report bought with a hidden footnote.
#
# ----------------------------------------------------------------------------------
# Tags
# ----------------------------------------------------------------------------------
#
#   single-step   one interaction: a click, a keystroke, a menu choice
#   multi-step    several dependent interactions on one screen or feature
#   composite     spans screens or features, and is the shape a skill library is
#                 supposed to get good at by chaining what it already knows
#
# The mix is deliberate: a suite where every task is the same shape proves nothing
# about composition, and a suite of only hard tasks cannot show a clean warm hit.
# Counts below: 5 single-step, 5 multi-step, 4 composite.

suite: sandbox-site
domain: sandbox.test
base_url: http://127.0.0.1:8765

# Cold once, then this many warm runs, resetting the app before every one of them.
# Overridden by `skillweaver eval run --repeat N`.
warm_runs: 3

tasks:
  # -- single-step ------------------------------------------------------------------

  - id: open_records
    text: Open the Records screen.
    tags: [single-step]
    expect:
      - path: ui.screen
        equals: records

  - id: open_settings
    text: Open the Settings screen.
    tags: [single-step]
    expect:
      - path: ui.screen
        equals: settings

  - id: search_mail_for_invoice
    text: Search the mailbox for "invoice".
    tags: [single-step]
    params: {query: "invoice"}
    expect:
      - path: ui.mail.search
        equals: invoice

  - id: read_billing_message
    text: Open the message from Billing titled "Invoice 4471 is ready".
    tags: [single-step]
    params: {sender: "Billing", subject: "Invoice 4471 is ready"}
    expect:
      - path: ui.mail.openId
        equals: m03
      # Opening a message is what marks it read; this is the state change, not the
      # selection, so it is what the check looks at.
      - path: mail.messages[id=m03].unread
        equals: false

  - id: filter_records_for_storage
    text: Filter the records table for "storage".
    tags: [single-step]
    params: {query: "storage"}
    expect:
      - path: ui.records.filter
        equals: storage

  # -- multi-step -------------------------------------------------------------------

  - id: archive_billing_message
    text: Archive the message from Billing titled "Invoice 4471 is ready".
    tags: [multi-step]
    params: {sender: "Billing", subject: "Invoice 4471 is ready"}
    expect:
      - path: mail.messages[id=m03].archived
        equals: true
      # Nothing else may be archived: a run that selected all and archived the inbox
      # also satisfies the check above, and that is not the task that was asked for.
      - path: mail.messages[id=m01].archived
        equals: false
      - path: mail.messages[id=m05].archived
        equals: false

  - id: label_lunch_as_travel
    text: Add the "Travel" label to Helen Okafor's message "Lunch on Thursday?".
    tags: [multi-step]
    params: {subject: "Lunch on Thursday?", label: "Travel"}
    expect:
      - path: mail.messages[id=m05].labels
        contains: Travel

  - id: sort_records_by_priority_desc
    text: Sort the records table by Priority, descending.
    tags: [multi-step]
    params: {column: "Priority", direction: "descending"}
    expect:
      - path: ui.records.sortKey
        equals: priority
      - path: ui.records.sortDir
        equals: desc

  - id: rename_aurora_ledger
    text: Rename the record "Aurora Ledger" to "Aurora Ledger v2".
    tags: [multi-step]
    params: {record: "Aurora Ledger", new_name: "Aurora Ledger v2"}
    expect:
      - path: records.rows[id=r01].name
        equals: Aurora Ledger v2
      # The rename must be committed, not left sitting in the edit box.
      - path: ui.records.editingId
        absent: true

  - id: change_display_name
    text: Change the display name in Settings to "Avery Q." and save it.
    tags: [multi-step]
    params: {display_name: "Avery Q."}
    expect:
      - path: settings.displayName
        equals: Avery Q.
      # savedCount only moves when the confirmation dialog is confirmed, so this is
      # what separates "typed it" from "saved it".
      - path: settings.savedCount
        equals: 1
      - path: ui.settings.dialogOpen
        equals: false

  # -- composite --------------------------------------------------------------------

  - id: find_and_archive_maintenance_notice
    text: Find the message about scheduled maintenance for the file server and archive it.
    tags: [composite]
    params: {subject: "Scheduled maintenance for the file server"}
    expect:
      - path: mail.messages[id=m10].archived
        equals: true
      - path: mail.messages[id=m01].archived
        equals: false

  - id: pause_security_records
    text: >-
      Filter the records table to the Security category, then set every row shown to
      the Paused status.
    tags: [composite]
    params: {category: "Security", status: "Paused"}
    expect:
      - path: records.rows[id=r05].status
        equals: Paused
      - path: records.rows[id=r15].status
        equals: Paused
      - path: records.rows[id=r30].status
        equals: Paused
      # A run that selected everything and paused the whole table would pass the three
      # checks above. This row is not in the Security category and must be untouched.
      - path: records.rows[id=r03].status
        equals: Active

  - id: export_filtered_records
    text: Filter the records table for "ledger" and export the shown rows to CSV.
    tags: [composite]
    params: {query: "ledger"}
    expect:
      - path: records.exports
        at_least: 1
      - path: records.exports[0].filter
        contains: ledger
      - path: records.exports[0].rowIds
        contains: r01

  - id: reply_to_capacity_plan
    text: >-
      Open Dana Whitfield's message about the Q3 capacity plan, then compose and send
      a message to dana.whitfield@northwind.example with the subject "Signed off".
    tags: [composite]
    params: {to: "dana.whitfield@northwind.example", subject: "Signed off"}
    expect:
      - path: mail.sent
        at_least: 1
      - path: mail.sent[0].to
        equals: dana.whitfield@northwind.example
      - path: mail.sent[0].subject
        equals: Signed off
      - path: mail.messages[id=m01].unread
        equals: false
