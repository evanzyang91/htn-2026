# The DoorDash-CLASS suite: 12 tasks against Pantry Lane, the ordering app in
# apps/sandbox-site. Separate from eval/tasks.yaml on purpose; run it the same way:
#
#     python3 apps/sandbox-site/serve.py --port 8765 &
#     SKILLWEAVER_MAX_SECONDS=900 SKILLWEAVER_MAX_USD=4 \
#     SKILLWEAVER_MAX_STEPS=70 SKILLWEAVER_MAX_LLM_CALLS=100 \
#         uv run python -m skillweaver.cli eval run --suite eval/order.yaml --repeat 3
#
# The raised budget is not decoration. The default Budget is 300 seconds and $2 per
# run (see skillweaver.config), which is sized for the mail-and-records tasks in
# eval/tasks.yaml. The composite tasks here are longer by design - "place the order"
# is eight or nine dependent interactions, each costing the explorer one round trip -
# and at the default ceiling the COLD run runs out of seconds partway through the
# cart and the task is scored as unlearnable. A task that cannot be learned cold has
# no warm number either, so the whole suite would report nothing. Cold runs here take
# roughly 40 to 200 seconds; warm runs take 6 to 17 and cost nothing.
#
# ----------------------------------------------------------------------------------
# Why this suite exists
# ----------------------------------------------------------------------------------
#
# DoorDash itself is not reachable by this project. Pointed at https://www.doordash.com/
# the shipped agent never sees any DoorDash content: Cloudflare serves an interstitial
# reading "Verify you are human", and perception finds ten text elements, all of them
# belonging to that challenge page. The identical code finds eighty-one elements on a
# Wikipedia article, so this is not a perception problem - the site refuses automated
# browsers at the door. Getting past that check is bot-detection evasion; this project
# will not do it, and a demo resting on it would break the day Cloudflare tightened.
#
# So the CLASS is demonstrated instead, honestly. What makes an ordering task different
# from a Wikipedia task is not the brand, it is the shape:
#
#   * a catalogue that has to be SEARCHED and FILTERED before the right row is found,
#   * a DETAIL page that has to be navigated into, with required choices that make a
#     blind click fail rather than accidentally succeed,
#   * and a multi-step STATE CHANGE that COMMITS - a cart that fills and an order that
#     gets placed.
#
# That last property is the hard one for this architecture. A candidate skill is only
# stored after being RE-RUN from its recorded starting screen (see WorldReset in
# orchestrator.py and the admission gate in skills/synthesize.py), so a task that
# changes state can only be learned if something can put the world back. A real cart
# has no reset endpoint and never will. Pantry Lane has `GET /__reset`, which restores
# the seed exactly - asserted by test_reset_undoes_a_placed_order and by the byte
# comparison in test_the_ordering_flow_reaches_the_same_pixels_after_a_reset.
#
# EIGHT OF THE TWELVE TASKS BELOW CHANGE STATE. Every one of them is reachable again
# after a reset, which is the whole point of putting them here.
##
# ----------------------------------------------------------------------------------
# What a real run of this suite found, 2026-09-19
# ----------------------------------------------------------------------------------
#
# 49 runs over the first 10 tasks before an unrelated OCR hang stopped the harness
# (filed as htn-ocr-hang; every thread parked in onnxruntime's native thread pool,
# where the skill time limit cannot fire because it is only checked from Python
# frames). 43 of 49 passed. All 10 cold runs succeeded, so every task reached was
# learnable. The numbers below come from the run log, not from a written report -
# the harness hung before write_report, so DOLLARS ARE NOT RECOVERABLE for this run
# and only model calls are quoted.
#
# The headline is real but it hides the finding, so both are here:
#
#   warm runs that REPLAYED a stored skill    21 runs   9.8 s   0.33 calls   11.7x
#   warm runs that FELL THROUGH to exploring  18 runs  94.3 s  11.89 calls    ~1x
#
# A warm run is only fast when retrieval fires. When it does, the saving is large and
# the model calls go to nearly zero. When it does not, the "warm" run explores from
# scratch and is no cheaper than the cold one.
#
# THE LONG TASK IS NOT WHERE REUSE PAID BEST, and that is worth stating plainly
# because it is the opposite of what this suite was built expecting. `place_an_order`
# is the longest flow here - eight or nine dependent interactions - and its warm runs
# retrieved NOTHING (skill_used=None, 19/24/3/19 calls, two of four failing). Run
# ALONE against an empty library the same task retrieves `order_dish_from_restaurant`
# and replays in 16.5 s with 1 model call, an 11.7x saving. The difference is not the
# task's length: it is that by the time it runs inside the full suite the library
# holds eight near-duplicate ordering skills, and retrieval stops discriminating.
# Reuse paid best on the SHORT, DISTINCT tasks - remove_from_cart 13.9x,
# add_dish_with_two_option_groups 14.1x, open_thai_restaurant 24.6x.
#
# The more dangerous shape is `order_appears_in_history`. All four of its warm runs
# retrieved `open_top_nav_tab` - a trivial navigation skill - ran it in 4 to 8
# seconds with ZERO model calls, and scored ok=False every time. Fast, free, confident
# and wrong. A speedup table that averaged wall-clock without checking ground truth
# would have reported that task as the best result in the suite.
#
# None of this is a defect in the app or in these tasks; it is a retrieval-precision
# finding about a library filling up with near-duplicates, and it belongs to whoever
# owns skills/retrieve.py and agent/planner.py.
#
# ----------------------------------------------------------------------------------
# How a task is scored
# ----------------------------------------------------------------------------------
#
# Identical to eval/tasks.yaml - `expect` is a list of checks against the sandbox's own
# GET /__state, which the agent never sees. Each check is `path` plus exactly one of
# `equals`, `contains`, `count`, `at_least`, `absent`; `path` is dotted with either a
# positional index (`order.orders[0]`) or a key match (`order.cart[dishId=d-kettle-padthai]`).
# Tags are `single-step`, `multi-step` and `composite`.
#
# Money is INTEGER CENTS everywhere, in the seed, on the server and in the browser, so
# a total can be asserted exactly. Delivery is 399 and the default tip is 400.
#
# Counts below: 3 single-step, 5 multi-step, 4 composite.

suite: pantry-lane
domain: sandbox.test
base_url: http://127.0.0.1:8765

warm_runs: 3

tasks:
  # -- single-step ------------------------------------------------------------------

  - id: open_order_app
    text: Open the Order screen.
    tags: [single-step]
    expect:
      - path: ui.screen
        equals: order

  - id: filter_by_cuisine
    text: On the Order screen, filter the restaurants to Japanese.
    tags: [single-step]
    params: {cuisine: "Japanese"}
    expect:
      - path: ui.order.cuisine
        equals: Japanese

  - id: search_for_a_dish
    text: On the Order screen, search the restaurants for "churros".
    tags: [single-step]
    params: {query: "churros"}
    expect:
      - path: ui.order.search
        equals: churros

  # -- multi-step -------------------------------------------------------------------

  - id: open_thai_restaurant
    text: >-
      On the Order screen, filter the restaurants to the Thai cuisine and open
      Copper Kettle's menu.
    tags: [multi-step]
    params: {cuisine: "Thai", restaurant: "Copper Kettle"}
    expect:
      - path: ui.order.cuisine
        equals: Thai
      - path: ui.order.view
        equals: restaurant
      - path: ui.order.restaurantId
        equals: rest-kettle

  - id: add_dish_with_option
    text: >-
      On the Order screen, open Copper Kettle and add a Large Pad Thai to the cart.
    tags: [multi-step]
    params: {restaurant: "Copper Kettle", dish: "Pad Thai", option: "Large"}
    expect:
      - path: order.cart
        count: 1
      - path: order.cart[0].name
        equals: Pad Thai
      - path: order.cart[0].choiceText
        equals: Large
      # 1450 base + 300 for the large portion. A run that added the Regular portion
      # also produces one line called Pad Thai, and this is what separates them.
      - path: order.cart[0].unitPriceCents
        equals: 1750
      - path: order.cart[0].qty
        equals: 1

  - id: add_dish_with_two_option_groups
    text: >-
      On the Order screen, open Forno Nove and add a Fourteen inch Thin crust
      Margherita Pizza to the cart.
    tags: [multi-step]
    params:
      restaurant: "Forno Nove"
      dish: "Margherita Pizza"
      size: "Fourteen inch"
      crust: "Thin"
    expect:
      - path: order.cart
        count: 1
      - path: order.cart[0].dishId
        equals: d-forno-margherita
      - path: order.cart[0].choiceText
        equals: Fourteen inch, Thin
      - path: order.cart[0].unitPriceCents
        equals: 2100

  - id: change_cart_quantity
    text: >-
      On the Order screen, add a Regular Pad Thai from Copper Kettle to the cart and
      then change its quantity to three.
    tags: [multi-step]
    params: {dish: "Pad Thai", option: "Regular", quantity: 3}
    expect:
      - path: order.cart
        count: 1
      - path: order.cart[dishId=d-kettle-padthai].qty
        equals: 3
      - path: order.cart[dishId=d-kettle-padthai].unitPriceCents
        equals: 1450

  - id: remove_from_cart
    text: >-
      On the Order screen, add Elote and Churros from Ember Taqueria to the cart, then
      remove the Churros, leaving only the Elote.
    tags: [multi-step]
    params: {restaurant: "Ember Taqueria", keep: "Elote", remove: "Churros"}
    expect:
      - path: order.cart
        count: 1
      - path: order.cart[0].name
        equals: Elote
      # Emptying the cart entirely would leave zero lines, not one, so the count above
      # already rules that out; this names the survivor so a wrong removal is visible.
      - path: order.cart[0].restaurant
        equals: Ember Taqueria

  # -- composite --------------------------------------------------------------------

  - id: place_an_order
    text: >-
      On the Order screen, add a Large Pad Thai from Copper Kettle to the cart and
      place the order.
    tags: [composite]
    params: {restaurant: "Copper Kettle", dish: "Pad Thai", option: "Large"}
    expect:
      - path: order.orders
        count: 1
      - path: order.orders[0].items[0].name
        equals: Pad Thai
      - path: order.orders[0].itemCount
        equals: 1
      # 1750 for the dish + 399 delivery + the 400 default tip. Checking the total
      # rather than only the presence of an order is what makes "the right thing was
      # ordered" part of the verdict.
      - path: order.orders[0].totalCents
        equals: 2549
      - path: order.orders[0].status
        equals: Confirmed
      # The commitment is only complete when the cart has been handed over. A run that
      # opened the dialog and stopped leaves the cart full and no order at all.
      - path: order.cart
        count: 0

  - id: order_appears_in_history
    text: >-
      On the Order screen, order two Vegetable Rolls from Sakura Counter, then open the
      Orders tab and confirm the order is listed there.
    tags: [composite]
    params: {restaurant: "Sakura Counter", dish: "Vegetable Roll", quantity: 2}
    expect:
      - path: order.orders
        count: 1
      - path: order.orders[0].items[0].name
        equals: Vegetable Roll
      - path: order.orders[0].items[0].qty
        equals: 2
      - path: order.orders[0].restaurants
        contains: Sakura Counter
      - path: ui.order.view
        equals: orders

  - id: order_from_two_restaurants
    text: >-
      On the Order screen, add a Reuben from North Loop Deli and a Tiramisu from
      Forno Nove to the same cart, then place the order.
    tags: [composite]
    params:
      first_restaurant: "North Loop Deli"
      first_dish: "Reuben"
      second_restaurant: "Forno Nove"
      second_dish: "Tiramisu"
    expect:
      - path: order.orders
        count: 1
      - path: order.orders[0].restaurants
        count: 2
      - path: order.orders[0].restaurants
        contains: Forno Nove
      - path: order.orders[0].restaurants
        contains: North Loop Deli
      - path: order.orders[0].itemCount
        equals: 2
      # 1400 Reuben + 900 Tiramisu + 399 delivery + 400 default tip.
      - path: order.orders[0].totalCents
        equals: 3099

  - id: order_with_address_and_tip
    text: >-
      On the Order screen, add a Falafel Wrap from Green Row to the cart, change the
      delivery address to "9 Beech Lane", set the tip to $6.00, and place the order.
    tags: [composite]
    params:
      restaurant: "Green Row"
      dish: "Falafel Wrap"
      address: "9 Beech Lane"
      tip: "$6.00"
    expect:
      - path: order.orders
        count: 1
      - path: order.orders[0].address
        equals: 9 Beech Lane
      - path: order.orders[0].tipCents
        equals: 600
      # 1150 wrap + 399 delivery + 600 tip.
      - path: order.orders[0].totalCents
        equals: 2149
