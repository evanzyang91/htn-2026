<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run</title>
<style>
  :root {
    --bg: #0d0d0d; --fg: #ececec; --muted: #8e8e8e;
    --panel: #141414; --border: #2a2a2a; --accent: #2f6fe4; --ok: #3ccf7a; --bad: #e05a5a;
    --mono: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  header .task { flex: 1; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .task small { color: var(--muted); margin-left: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; }
  .dot.busy { animation: pulse 1s infinite; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .25; } }
  #state { color: var(--muted); font-size: 13px; }
  button {
    border: 1px solid var(--border); background: #1b1b1b; color: var(--fg);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button:disabled { opacity: .35; cursor: default; }
  main { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) 220px; }
  .view {
    display: grid; place-items: center; background: #000; overflow: hidden; position: relative;
  }
  .view img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
  .view .waiting { color: var(--muted); font-size: 14px; text-align: center; padding: 0 24px; }
  .view.live img { display: block; }
  .view.live .waiting { display: none; }
  .log {
    border-top: 1px solid var(--border); background: var(--panel);
    overflow: auto; padding: 12px 18px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; color: #cfcfcf;
  }
  .log .cmd { color: var(--muted); }
  .drag { height: 6px; cursor: row-resize; background: transparent; }
</style>
</head>
<body>
  <header>
    <span class="dot busy" id="dot"></span>
    <div class="task" id="task"></div>
    <span id="state">starting</span>
    <button id="stop">Stop</button>
  </header>
  <main>
    <div class="view" id="view">
      <div class="waiting">Waiting for the agent's browser window to appear…</div>
      <img id="frame" alt="the agent's browser">
    </div>
    <div class="log" id="log"></div>
  </main>
<script>
  const id = location.pathname.split('/').pop();
  const dot = document.getElementById('dot');
  const state = document.getElementById('state');
  const taskEl = document.getElementById('task');
  const stop = document.getElementById('stop');
  const view = document.getElementById('view');
  const frame = document.getElementById('frame');
  const log = document.getElementById('log');
  let running = true;

  fetch(`/api/runs/${id}`).then(r => r.json()).then(info => {
    document.title = `Run ${info.id} · ${info.task}`;
    taskEl.innerHTML = '';
    taskEl.append(info.task);
    if (info.url) { const s = document.createElement('small'); s.textContent = info.url; taskEl.append(s); }
  });

  function append(text, cls) {
    const el = document.createElement('div');
    if (cls) el.className = cls;
    el.textContent = text;
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    log.appendChild(el);
    if (nearBottom) log.scrollTop = log.scrollHeight;
  }

  // Live mirror: one frame in flight at a time, at whatever rate the server answers.
  let misses = 0;
  async function tick() {
    if (!running && misses > 4) return;
    try {
      const r = await fetch(`/api/runs/${id}/frame.jpg?t=${Date.now()}`);
      if (r.status === 200) {
        const blob = await r.blob();
        const next = URL.createObjectURL(blob);
        const prev = frame.src;
        frame.src = next;
        if (prev) URL.revokeObjectURL(prev);
        view.classList.add('live');
        misses = 0;
      } else {
        misses += 1;
      }
    } catch (e) { misses += 1; }
    setTimeout(tick, running ? 450 : 1500);
  }
  tick();

  const source = new EventSource(`/api/runs/${id}/events`);
  source.addEventListener('line', (ev) => {
    const line = JSON.parse(ev.data);
    append(line, line.startsWith('$ ') ? 'cmd' : '');
    state.textContent = 'running';
  });
  source.addEventListener('done', (ev) => {
    const {exit_code} = JSON.parse(ev.data);
    source.close();
    running = false;
    stop.disabled = true;
    const ok = exit_code === 0;
    dot.className = 'dot ' + (ok ? 'ok' : 'bad');
    state.textContent = ok ? 'done' : `finished with exit code ${exit_code}`;
  });
  source.onerror = () => {
    if (!running) return;
    append('[connection to the server lost]', 'cmd');
    running = false; dot.className = 'dot bad'; state.textContent = 'disconnected';
  };
  stop.addEventListener('click', () => fetch(`/api/runs/${id}/stop`, {method: 'POST'}));
</script>
</body>
</html>
