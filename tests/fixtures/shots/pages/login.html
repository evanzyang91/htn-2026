<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 640px; height: 480px; position: relative;
    background: #ffffff; color: #111111;
    font-family: Helvetica, Arial, sans-serif; font-size: 17px;
    -webkit-font-smoothing: antialiased;
  }
  .at { position: absolute; display: flex; align-items: center; }
  .head { font-size: 26px; font-weight: 700; }
  .label { font-size: 15px; color: #444444; }
  .field {
    background: #ffffff; border: 2px solid #555555; border-radius: 4px;
    padding-left: 10px; color: #444444;
  }
  .btn {
    justify-content: center; background: #0f7a3d; color: #ffffff;
    font-size: 17px; font-weight: 600; border-radius: 4px;
  }
  .check { border: 2px solid #555555; border-radius: 3px; }
  .link { color: #1b4fd8; text-decoration: underline; }
</style>
</head>
<body>
  <div class="at head"  data-kind="text"       style="left:56px; top:48px;  width:300px; height:36px;">Sign in to Ledger</div>

  <div class="at label" data-kind="text"       style="left:56px; top:120px; width:160px; height:22px;">Email address</div>
  <div class="at field" data-kind="text_field" style="left:56px; top:150px; width:320px; height:44px;">you@example.com</div>

  <div class="at label" data-kind="text"       style="left:56px; top:214px; width:160px; height:22px;">Password</div>
  <div class="at field" data-kind="text_field" style="left:56px; top:244px; width:320px; height:44px;">Enter password</div>

  <div class="at check" data-kind="checkbox"   style="left:56px; top:312px; width:22px;  height:22px;"></div>
  <div class="at label" data-kind="text"       style="left:88px; top:312px; width:180px; height:22px;">Keep me signed in</div>

  <div class="at btn"   data-kind="button"     style="left:56px; top:368px; width:160px; height:48px;">Sign In</div>
  <div class="at link"  data-kind="link"       style="left:248px; top:380px; width:180px; height:24px;">Forgot password?</div>
</body>
</html>
