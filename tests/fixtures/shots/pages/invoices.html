<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoices</title>
<style>
  /* Deliberately plain, high-contrast and generously spaced: these pages exist to
     be read back by OCR, not to look modern. Absolute positioning keeps every
     ground-truth box identical across Chromium versions. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px; height: 600px; position: relative;
    background: #ffffff; color: #111111;
    font-family: Helvetica, Arial, sans-serif; font-size: 17px;
    -webkit-font-smoothing: antialiased;
  }
  .at { position: absolute; display: flex; align-items: center; }
  .head { font-size: 28px; font-weight: 700; }
  .btn {
    justify-content: center; background: #1b4fd8; color: #ffffff;
    font-size: 17px; font-weight: 600; border-radius: 4px;
  }
  .btn.ghost { background: #ffffff; color: #1b4fd8; border: 2px solid #1b4fd8; }
  .field {
    background: #ffffff; border: 2px solid #555555; border-radius: 4px;
    padding-left: 10px; color: #444444;
  }
  .link { color: #1b4fd8; text-decoration: underline; }
  .row { border-bottom: 1px solid #cccccc; padding-left: 8px; }
  .muted { color: #555555; font-size: 15px; }
</style>
</head>
<body>
  <div class="at head"      data-kind="text"       style="left:40px;  top:32px;  width:300px; height:40px;">Open Invoices</div>
  <div class="at muted"     data-kind="text"       style="left:40px;  top:84px;  width:320px; height:24px;">Acme Corporation billing</div>

  <div class="at field"     data-kind="text_field" style="left:40px;  top:132px; width:300px; height:44px;">Search invoices</div>
  <div class="at btn"       data-kind="button"     style="left:360px; top:132px; width:120px; height:44px;">Search</div>
  <div class="at btn ghost" data-kind="button"     style="left:500px; top:132px; width:150px; height:44px;">New Invoice</div>

  <div class="at row"       data-kind="row"        style="left:40px;  top:220px; width:610px; height:48px;">INV-1042 &nbsp; Globex &nbsp; $1,280.00</div>
  <div class="at row"       data-kind="row"        style="left:40px;  top:284px; width:610px; height:48px;">INV-1043 &nbsp; Initech &nbsp; $940.50</div>
  <div class="at row"       data-kind="row"        style="left:40px;  top:348px; width:610px; height:48px;">INV-1044 &nbsp; Umbrella &nbsp; $3,115.75</div>

  <div class="at link"      data-kind="link"       style="left:40px;  top:432px; width:190px; height:28px;">Download report</div>
  <div class="at link"      data-kind="link"       style="left:264px; top:432px; width:160px; height:28px;">Billing settings</div>

  <div class="at btn"       data-kind="button"     style="left:40px;  top:496px; width:190px; height:48px;">Send Reminders</div>
  <div class="at muted"     data-kind="text"       style="left:264px; top:508px; width:300px; height:24px;">3 invoices overdue</div>
</body>
</html>
