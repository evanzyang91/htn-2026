<!doctype html>
<meta charset="utf-8">
<title>skillweaver click fixture</title>
<!--
  Every target is absolutely positioned so its box is known from this file alone,
  and every interaction writes what happened into a visible readout. A test can
  therefore click a coordinate and read back whether the right element reacted.
  Coordinates recorded here are event.clientX/clientY: CSS pixels relative to the
  viewport, which is exactly skillweaver's LOGICAL pixel space.
-->
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font: 14px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .target { position: absolute; box-sizing: border-box; }
  #alpha { left: 40px;  top: 40px;  width: 160px; height: 50px; background: #2d6cdf; color: #fff; border: 0; }
  #beta  { left: 240px; top: 40px;  width: 160px; height: 50px; background: #d94f3d; color: #fff; border: 0; }
  #field { left: 40px;  top: 140px; width: 300px; height: 40px; border: 2px solid #444; font-size: 16px; }
  #pad   { left: 40px;  top: 320px; width: 400px; height: 200px; background: #eef2f8; border: 2px dashed #7a8ba3; }
  .readout { position: absolute; left: 470px; font-family: ui-monospace, Menlo, monospace; }
  #last   { top: 40px; }
  #clicks { top: 70px; }
  #echo   { top: 100px; }
  #keys   { top: 130px; }
  #drag   { top: 160px; }
</style>

<button class="target" id="alpha">Alpha</button>
<button class="target" id="beta">Beta</button>
<input class="target" id="field" type="text" placeholder="type here">
<div class="target" id="pad">drag pad</div>

<div class="readout" id="last">last: none</div>
<div class="readout" id="clicks">clicks: 0 at -,-</div>
<div class="readout" id="echo">echo: </div>
<div class="readout" id="keys">keys: </div>
<div class="readout" id="drag">drag: none</div>

<script>
  const show = (id, text) => { document.getElementById(id).textContent = text; };
  let clickCount = 0;

  // A click anywhere records where it landed; a click on a target also names it.
  // Together these let a test distinguish "hit the right box" from "hit nothing".
  document.addEventListener('click', (e) => {
    clickCount += 1;
    show('clicks', `clicks: ${clickCount} at ${e.clientX},${e.clientY}`);
    const target = e.target.closest('.target');
    show('last', `last: ${target ? target.id : 'none'}${e.detail === 2 ? ' x2' : ''}`);
  });

  document.getElementById('field').addEventListener('input', (e) => {
    show('echo', `echo: ${e.target.value}`);
  });

  // Record the full chord so a test can assert modifiers were really held down.
  document.addEventListener('keydown', (e) => {
    const parts = [];
    if (e.ctrlKey) parts.push('Control');
    if (e.metaKey) parts.push('Meta');
    if (e.shiftKey) parts.push('Shift');
    if (e.altKey) parts.push('Alt');
    if (!['Control', 'Meta', 'Shift', 'Alt'].includes(e.key)) parts.push(e.key);
    show('keys', `keys: ${parts.join('+')}`);
  });

  let dragStart = null;
  document.addEventListener('mousedown', (e) => { dragStart = [e.clientX, e.clientY]; });
  document.addEventListener('mouseup', (e) => {
    if (dragStart && (dragStart[0] !== e.clientX || dragStart[1] !== e.clientY)) {
      show('drag', `drag: ${dragStart[0]},${dragStart[1]} -> ${e.clientX},${e.clientY}`);
    }
    dragStart = null;
  });
</script>
